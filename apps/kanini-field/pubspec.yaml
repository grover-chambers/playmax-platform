name: niceos_app
description: NiceOS mobile app for Market Link Ltd field operations
publish_to: 'none'
version: 1.3.1+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^11.1.0
  image_picker: ^1.0.7
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  supabase_flutter: ^2.3.0
  flutter_dotenv: ^5.1.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/geo/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
